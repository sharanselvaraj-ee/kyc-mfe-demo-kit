<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KYC onboarding — dummy host</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      .layout { display: grid; grid-template-columns: 1fr 20rem; gap: 2rem; max-width: 64rem; margin: 2rem auto; padding: 0 1rem; align-items: start; }
      #dev-panel { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; font-size: 0.85rem; }
      #dev-panel h2 { font-size: 1rem; margin-top: 0; }
      #dev-panel dl { margin: 0; }
      #dev-panel dt { font-weight: bold; }
      #dev-panel dd { margin: 0 0 0.5rem; font-family: monospace; }
      #event-log { max-height: 10rem; overflow-y: auto; margin: 0; padding-left: 1.2rem; font-family: monospace; font-size: 0.8rem; }
      label { display: block; margin: 0.4rem 0; }
    </style>
  </head>
  <body>
    <div class="layout">
      <main>
        <h1>Dummy host page</h1>
        <p>One script tag, one custom element. Everything below the line is the micro-frontend.</p>
        <hr />
        <kyc-onboarding id="kyc" geo="GB" api-base="/api"></kyc-onboarding>
      </main>
      <aside id="dev-panel">
        <h2>Dev panel</h2>
        <label>
          Geo
          <select id="geo-select">
            <option value="GB">GB</option>
            <option value="IN">IN</option>
            <option value="AE">AE</option>
            <option value="SG">SG</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="inject-unknown" />
          Inject unknown component (RT-002)
        </label>
        <h2>Last agent response</h2>
        <dl id="agent-headers">
          <dt>source</dt>
          <dd>—</dd>
        </dl>
        <h2>Event log (MFE-002)</h2>
        <ul id="event-log"></ul>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
