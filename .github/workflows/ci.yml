# SLIDE: "The harness is the real guarantee" (pnpm verify, run on every push and PR)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Tests never call Claude (CLAUDE.md §3) — KYC_AGENT_MODE=recorded in
      # tests/e2e/playwright.config.ts means no ANTHROPIC_API_KEY is needed here.
      - run: pnpm install --frozen-lockfile

      - name: IR-001 — Mitosis output matches what's committed
        run: |
          pnpm ir:build
          git diff --exit-code -- packages/gen || {
            echo "::error::packages/gen is out of date. Run 'pnpm ir:build' locally and commit the result.";
            exit 1;
          }

      - name: Install Playwright's browser
        run: pnpm --filter @kyc/tests exec playwright install --with-deps chromium

      # Each check runs even if an earlier one failed, so a PR shows every
      # failing check at once instead of stopping at the first (the combined
      # `pnpm verify` script short-circuits on `&&`; this doesn't).
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm trace
        if: ${{ !cancelled() }}
      - run: pnpm size
        if: ${{ !cancelled() }}
      - run: pnpm test:e2e
        if: ${{ !cancelled() }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
